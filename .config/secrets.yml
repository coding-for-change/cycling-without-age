# Deployment secrets, encrypted with Ansible Vault (inline !vault tags).
# The vault password lives ONLY in the GitHub Actions secret ANSIBLE_VAULT_PASSWORD.
#
# To add/replace a value (see README for the full setup):
#   ansible-vault encrypt_string --vault-password-file <pass-file> '<value>' --name '<KEY>' >> .config/secrets.yml
#
# Required keys:
#   REGISTRY_USERNAME  - user for registry.infra.codingforchange.com
#   REGISTRY_PASSWORD  - password for the registry
#   VPS_DEPLOY_KEY     - private SSH key for deploy-cwa@codingforchange.com (encrypt with --stdin-name)
#   DATABASE_URL       - prod DB, e.g. mysql://cwa:<pass>@host.docker.internal:3306/cwa
