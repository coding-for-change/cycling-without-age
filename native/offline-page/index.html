<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Cycling Without Age</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body data-reason="offline">
    <main class="screen">
      <picture class="logo">
        <source
          srcset="logo-dark.png"
          media="(prefers-color-scheme: dark)"
        />
        <img
          src="logo.png"
          alt="Cycling Without Age"
          width="140"
          height="50"
        />
      </picture>

      <section class="message">
        <div class="badge" aria-hidden="true">
          <svg
            class="badge-icon"
            data-shown-when="offline"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h.01" />
            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
            <path d="m2 2 20 20" />
          </svg>
          <svg
            class="badge-icon"
            data-shown-when="unreachable"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"
            />
            <path
              d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"
            />
            <path d="m2 2 20 20" />
          </svg>
        </div>
        <h1 data-text="title"></h1>
        <p class="description" data-text="description"></p>
      </section>

      <footer class="actions">
        <button type="button" class="retry" data-action="retry">
          <svg
            class="retry-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          <span data-text="retry"></span>
        </button>
        <p class="status" role="status" data-text="status"></p>
      </footer>
    </main>

    <script src="offline-config.js"></script>
    <script src="offline.js"></script>
  </body>
</html>
