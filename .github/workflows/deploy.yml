name: Deploy

# Build both images (cwa and cwa-media-worker) from one commit, push them to the registry of
# infra-v2, then start the deploy in infra-v2 (starts the inactive blue/green slot with the app
# and the queue workers, waits for the health checks, switches Caddy, stops the workers of the
# previous slot). The server side (compose file, runtime secrets, Redis, Caddy) lives in
# infra-v2, role `cycling_without_age`.
#
# Secrets:
#   - .config/secrets.yml (inline vault, repo secret ANSIBLE_VAULT_PASSWORD): only the
#     build-time keys in BUILD_KEYS. Runtime secrets are in infra-v2's vault.
#   - org secrets REGISTRY_*, DEPLOY_APP_ID, DEPLOY_APP_PRIVATE_KEY (this repo is in
#     `github_secret_repos` of infra-v2)
#
# This repo is public and may not call a workflow of the private infra-v2, so the deploy
# job starts infra-v2's deploy-dispatch.yml through the API and waits for it. The deploy
# logs stay in infra-v2.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, newer pushes wait instead of cancelling a deploy that is under way
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The Docker registry of the infrastructure, the same for every project
  REGISTRY: docker-registry.codingforchange.com
  # Keys read out of .config/secrets.yml, all masked in the logs
  BUILD_KEYS: >-
    NEXT_PUBLIC_MAPBOX_TOKEN SENTRY_AUTH_TOKEN NEXT_PUBLIC_SENTRY_DSN
  SENTRY_ORG: codingforchange
  SENTRY_PROJECT: cycling-without-age
  APP_URL: https://cwa.codingforchange.com

jobs:
  build:
    name: Build and push the images
    runs-on: ubuntu-latest
    outputs:
      has_sentry_token: ${{ steps.secrets.outputs.has_sentry_token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decrypt the build secrets
        id: secrets
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
          fi
          SECRETS_DIR="$RUNNER_TEMP/secrets"
          mkdir -p "$SECRETS_DIR" && chmod 700 "$SECRETS_DIR"
          echo "SECRETS_DIR=$SECRETS_DIR" >> "$GITHUB_ENV"
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$SECRETS_DIR/.vault_pass"

          # The file uses inline !vault tags rather than full-file encryption, so a tiny
          # playbook parses it.
          cat << EOF > "$SECRETS_DIR/dump.yml"
          - hosts: localhost
            gather_facts: false
            vars_files:
              - $GITHUB_WORKSPACE/.config/secrets.yml
            tasks:
              - copy:
                  content: "{{ vars | to_nice_json }}"
                  dest: $SECRETS_DIR/decrypted.json
          EOF
          ansible-playbook "$SECRETS_DIR/dump.yml" --vault-password-file "$SECRETS_DIR/.vault_pass"

          # Keep only the build keys, so nothing else from the vault is on the runner
          jq --arg keys "$BUILD_KEYS" '. as $all | reduce ($keys | split(" ")[] | select(. != "")) as $k ({}; .[$k] = ($all[$k] // ""))' \
            "$SECRETS_DIR/decrypted.json" > "$SECRETS_DIR/build.json"
          rm -f "$SECRETS_DIR/decrypted.json" "$SECRETS_DIR/.vault_pass"

          # Register the values with GitHub Actions to mask them in the (public) logs
          for key in $BUILD_KEYS; do
            value=$(jq -r --arg k "$key" '.[$k]' "$SECRETS_DIR/build.json")
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
          done
          if [ -n "$(jq -r '.SENTRY_AUTH_TOKEN' "$SECRETS_DIR/build.json")" ]; then
            echo "has_sentry_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sentry_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sentry CLI
        if: steps.secrets.outputs.has_sentry_token == 'true'
        run: |
          curl https://cli.sentry.dev/install -fsS | bash -s -- --version 0.45.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create Sentry release
        if: steps.secrets.outputs.has_sentry_token == 'true'
        continue-on-error: true
        run: |
          SENTRY_AUTH_TOKEN="$(jq -r '.SENTRY_AUTH_TOKEN' "$SECRETS_DIR/build.json")"
          export SENTRY_AUTH_TOKEN
          sentry release create "$SENTRY_ORG/${{ github.sha }}" --project cycling-without-age,cwa-worker
          sentry release set-commits "$SENTRY_ORG/${{ github.sha }}" --auto

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Tag = commit sha only. No `latest`: the nightly prune deletes by digest and would
      # take the running image's manifest with it. The image names must match what the
      # infra-v2 role (cycling_without_age) pulls: localhost:5000/cwa and localhost:5000/cwa-media-worker, both
      # with the same tag.
      - name: Build and push the images
        run: |
          SENTRY_AUTH_TOKEN="$(jq -r '.SENTRY_AUTH_TOKEN' "$SECRETS_DIR/build.json")"
          export SENTRY_AUTH_TOKEN

          BUILD_ARGS=(
            --build-arg NEXT_PUBLIC_APP_URL="$APP_URL"
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="$(jq -r '.NEXT_PUBLIC_MAPBOX_TOKEN' "$SECRETS_DIR/build.json")"
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$(jq -r '.NEXT_PUBLIC_SENTRY_DSN' "$SECRETS_DIR/build.json")"
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            --build-arg SENTRY_RELEASE=${{ github.sha }}
            --build-arg SENTRY_ORG="$SENTRY_ORG"
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT"
            --secret id=sentry_token,env=SENTRY_AUTH_TOKEN
          )

          docker buildx build \
            --cache-from type=gha,scope=cwa-main \
            --cache-to type=gha,scope=cwa-main,mode=max \
            "${BUILD_ARGS[@]}" \
            --provenance=false \
            -t "$REGISTRY/cwa:${{ github.sha }}" \
            --push \
            .

          # Same build arguments, so every stage up to the runtime comes from the cache above.
          docker buildx build \
            --cache-from type=gha,scope=cwa-main \
            --target media-worker \
            "${BUILD_ARGS[@]}" \
            --provenance=false \
            -t "$REGISTRY/cwa-media-worker:${{ github.sha }}" \
            --push \
            .

      - name: Clean up the secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy runs in the private repo infra-v2 (workflow deploy-dispatch.yml): this job
    # starts it with a token of the GitHub App "c4c-infra-deploy" and waits for the result.
    # Its logs stay in infra-v2; this repo needs only DEPLOY_APP_ID and DEPLOY_APP_PRIVATE_KEY.
    steps:
      - name: Get a token for infra-v2
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: coding-for-change
          repositories: infra-v2
          permission-actions: write

      - name: Start the deploy in infra-v2 and wait for it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: cycling_without_age
          IMAGE_TAG: ${{ github.sha }}
          CALLER: ${{ github.repository }}#${{ github.run_id }}-${{ github.run_attempt }}
          INFRA_REPO: coding-for-change/infra-v2
        run: |
          gh workflow run deploy-dispatch.yml --repo "$INFRA_REPO" --ref main \
            -f app="$APP" -f image_tag="$IMAGE_TAG" -f caller="$CALLER"

          # The run name ends with "(<caller>)": find our run
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$INFRA_REPO" --workflow deploy-dispatch.yml \
                --event workflow_dispatch --limit 30 --json databaseId,displayTitle \
              | jq -r --arg c "($CALLER)" '[.[] | select(.displayTitle | endswith($c))][0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo "::error::deploy run in infra-v2 not found"; exit 1; }
          echo "Deploy run in infra-v2 (private): https://github.com/$INFRA_REPO/actions/runs/$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

          while :; do
            STATE=$(gh run view "$RUN_ID" --repo "$INFRA_REPO" --json status,conclusion --jq '.status + " " + .conclusion')
            [ "${STATE%% *}" = completed ] && break
            sleep 15
          done
          echo "Result: ${STATE#* }" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${STATE#* }" = success ]

  # The Sentry token is in the vault file, so the job decrypts it again (job outputs cannot
  # carry secrets).
  sentry:
    name: Finalize the Sentry release
    needs: [build, deploy]
    if: needs.build.outputs.has_sentry_token == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Finalize and mark the deploy
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
          fi
          SECRETS_DIR="$RUNNER_TEMP/secrets"
          mkdir -p "$SECRETS_DIR" && chmod 700 "$SECRETS_DIR"
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$SECRETS_DIR/.vault_pass"
          cat << EOF > "$SECRETS_DIR/dump.yml"
          - hosts: localhost
            gather_facts: false
            vars_files:
              - $GITHUB_WORKSPACE/.config/secrets.yml
            tasks:
              - copy:
                  content: "{{ {'t': SENTRY_AUTH_TOKEN} | to_json }}"
                  dest: $SECRETS_DIR/token.json
          EOF
          ansible-playbook "$SECRETS_DIR/dump.yml" --vault-password-file "$SECRETS_DIR/.vault_pass" > /dev/null
          SENTRY_AUTH_TOKEN=$(jq -r .t "$SECRETS_DIR/token.json")
          rm -rf "$SECRETS_DIR"
          echo "::add-mask::$SENTRY_AUTH_TOKEN"
          export SENTRY_AUTH_TOKEN
          curl https://cli.sentry.dev/install -fsS | bash -s -- --version 0.45.0
          export PATH="$HOME/.local/bin:$PATH"
          sentry release finalize "$SENTRY_ORG/${{ github.sha }}"
          sentry release deploy "$SENTRY_ORG/${{ github.sha }}" production --url "$APP_URL"
