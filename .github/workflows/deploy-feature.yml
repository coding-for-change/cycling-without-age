name: Deploy Feature Branch

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed the demo data when the database has no accounts yet"
        type: boolean
        default: true
      seed_mailbox:
        description: "Inbox for the seeded accounts' OTPs (you@example.com becomes you+superadmin@example.com, …). Defaults to the SEED_MAILBOX repo variable."
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check seed mailbox
        if: ${{ inputs.seed }}
        env:
          SEED_MAILBOX: ${{ inputs.seed_mailbox || vars.SEED_MAILBOX }}
        run: |
          if [ -z "$SEED_MAILBOX" ]; then
            echo "::warning::No seed_mailbox input or SEED_MAILBOX variable, so the database stays empty."
          elif ! printf '%s' "$SEED_MAILBOX" | grep -Eq '^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "::error::seed_mailbox must be a plain address like you@example.com (no +tag)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Decrypt Secrets
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
          fi
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

          cat << 'EOF' > dump.yml
          - hosts: localhost
            gather_facts: false
            vars_files:
              - .config/secrets.yml
            tasks:
              - copy:
                  dest: decrypted.json
                  content: >
                    {{ {
                      "REGISTRY_USERNAME": REGISTRY_USERNAME | default(""),
                      "REGISTRY_PASSWORD": REGISTRY_PASSWORD | default(""),
                      "CHAT_MASTER_KEY": CHAT_MASTER_KEY | default(""),
                      "RESEND_API_KEY": RESEND_API_KEY | default(""),
                      "MAPBOX_TOKEN": MAPBOX_TOKEN | default(""),
                      "NEXT_PUBLIC_MAPBOX_TOKEN": NEXT_PUBLIC_MAPBOX_TOKEN | default(""),
                      "S3_ENDPOINT": S3_ENDPOINT | default(""),
                      "FEATURE_S3_BUCKET": FEATURE_S3_BUCKET | default(""),
                      "FEATURE_S3_ACCESS_KEY_ID": FEATURE_S3_ACCESS_KEY_ID | default(""),
                      "FEATURE_S3_SECRET_ACCESS_KEY": FEATURE_S3_SECRET_ACCESS_KEY | default(""),
                      "SENTRY_AUTH_TOKEN": SENTRY_AUTH_TOKEN | default(""),
                      "NEXT_PUBLIC_SENTRY_DSN": NEXT_PUBLIC_SENTRY_DSN | default(""),
                      "SENTRY_DSN_WEB": SENTRY_DSN_WEB | default(""),
                      "SENTRY_DSN_WORKER": SENTRY_DSN_WORKER | default(""),
                      "VPS_DEPLOY_KEY": VPS_DEPLOY_KEY | default("")
                    } | to_json }}
                no_log: true
          EOF

          ansible-playbook dump.yml --vault-password-file .vault_pass

          # Mask single-line secrets
          echo "::add-mask::$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.REGISTRY_PASSWORD // empty' decrypted.json)"
          CHAT_MASTER_KEY=$(jq -r '.CHAT_MASTER_KEY // empty' decrypted.json)
          if [ -n "$CHAT_MASTER_KEY" ]; then echo "::add-mask::$CHAT_MASTER_KEY"; fi
          for key in SENTRY_AUTH_TOKEN NEXT_PUBLIC_SENTRY_DSN SENTRY_DSN_WEB SENTRY_DSN_WORKER RESEND_API_KEY MAPBOX_TOKEN NEXT_PUBLIC_MAPBOX_TOKEN FEATURE_S3_ACCESS_KEY_ID FEATURE_S3_SECRET_ACCESS_KEY; do
            value=$(jq -r --arg k "$key" '.[$k] // empty' decrypted.json)
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

          # IMPORTANT: We purposefully DO NOT use echo "::add-mask::..." for VPS_DEPLOY_KEY.
          # Attempting to mask a multiline string using echo causes bash to expand it into multiple lines.
          # GitHub Actions only masks the first line (the "BEGIN OPENSSH PRIVATE KEY" header),
          # and then logs the remaining lines in plain text, causing the key to leak.
          # Since the key is only written to a file later and never printed, it is safe without this command.

      - name: Set Safe Branch Name
        run: |
          BRANCH_NAME_SAFE=$(echo "${{ github.ref_name }}" | tr -cd 'a-zA-Z0-9-' | tr 'A-Z' 'a-z')
          echo "BRANCH_NAME_SAFE=$BRANCH_NAME_SAFE" >> $GITHUB_ENV

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          SENTRY_AUTH_TOKEN="$(jq -r '.SENTRY_AUTH_TOKEN // empty' decrypted.json)"
          export SENTRY_AUTH_TOKEN
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://${{ env.BRANCH_NAME_SAFE }}.cwa.codingforchange.com \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="$(jq -r '.NEXT_PUBLIC_MAPBOX_TOKEN // empty' decrypted.json)" \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=feature-${{ env.BRANCH_NAME_SAFE }} \
            --build-arg SENTRY_RELEASE=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$(jq -r '.NEXT_PUBLIC_SENTRY_DSN // empty' decrypted.json)" \
            --build-arg SENTRY_ORG=codingforchange \
            --build-arg SENTRY_PROJECT=cycling-without-age \
            --secret id=sentry_token,env=SENTRY_AUTH_TOKEN \
            -t registry.infra.codingforchange.com/cwa-${{ env.BRANCH_NAME_SAFE }}:${{ github.sha }} \
            -t registry.infra.codingforchange.com/cwa-${{ env.BRANCH_NAME_SAFE }}:latest \
            .

      - name: Login to registry
        run: |
          jq -r '.REGISTRY_PASSWORD // empty' decrypted.json | docker login registry.infra.codingforchange.com \
            -u "$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/cwa-${{ env.BRANCH_NAME_SAFE }}:${{ github.sha }}
          docker push registry.infra.codingforchange.com/cwa-${{ env.BRANCH_NAME_SAFE }}:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          jq -r '.VPS_DEPLOY_KEY // empty' decrypted.json > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts

      - name: Generate Configs and Environment
        run: |
          APP_PORT=$(echo "${{ env.BRANCH_NAME_SAFE }}" | cksum | awk '{print $1 % 1000 + 9000}')
          DB_PASSWORD="feature-secret-pass"

          echo "APP_PORT=$APP_PORT" > env_vars.txt
          echo "BRANCH_NAME_SAFE=${{ env.BRANCH_NAME_SAFE }}" >> env_vars.txt

          # Generate Caddyfile
          cat << EOF > Caddyfile
          ${{ env.BRANCH_NAME_SAFE }}.cwa.codingforchange.com {
              import access_log
              reverse_proxy localhost:${APP_PORT}
          }
          EOF

          # Generate .env
          echo "FEATURE_BRANCH=${{ github.ref_name }}" > .env
          echo "BRANCH_NAME_SAFE=${{ env.BRANCH_NAME_SAFE }}" >> .env
          echo "APP_PORT=${APP_PORT}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "DATABASE_URL=mysql://root:${DB_PASSWORD}@db:3306/cwa" >> .env
          echo "NEXT_PUBLIC_APP_URL=https://${{ env.BRANCH_NAME_SAFE }}.cwa.codingforchange.com" >> .env
          echo "BETTER_AUTH_URL=https://${{ env.BRANCH_NAME_SAFE }}.cwa.codingforchange.com" >> .env
          echo "EMAIL_FROM=cwa@codingforchange.com" >> .env
          echo "REDIS_URL=redis://redis:6379" >> .env
          echo "CHAT_MASTER_KEY=$(jq -r '.CHAT_MASTER_KEY // empty' decrypted.json)" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          echo "SENTRY_ENVIRONMENT=feature-${{ env.BRANCH_NAME_SAFE }}" >> .env
          echo "SENTRY_RELEASE=${{ github.sha }}" >> .env
          echo "METRICS_PORT=9464" >> .env
          for key in NEXT_PUBLIC_SENTRY_DSN SENTRY_DSN_WEB SENTRY_DSN_WORKER RESEND_API_KEY MAPBOX_TOKEN; do
            value=$(jq -r --arg k "$key" '.[$k] // empty' decrypted.json)
            if [ -n "$value" ]; then echo "$key=$value" >> .env; fi
          done
          S3_ENDPOINT=$(jq -r '.S3_ENDPOINT // empty' decrypted.json | sed -E 's#^(https://[^/]+).*#\1#')
          if [ -n "$S3_ENDPOINT" ]; then
            echo "S3_ENDPOINT=$S3_ENDPOINT" >> .env
            echo "S3_REGION=auto" >> .env
          fi
          for key in S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            value=$(jq -r --arg k "FEATURE_$key" '.[$k] // empty' decrypted.json)
            if [ -n "$value" ]; then echo "$key=$value" >> .env; fi
          done

      - name: Deploy to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-cwa@codingforchange.com"
          BRANCH_NAME_SAFE=$(grep BRANCH_NAME_SAFE env_vars.txt | cut -d'=' -f2)
          TARGET_DIR="/var/www/cwa-feature-${BRANCH_NAME_SAFE}"

          $SSH $SSH_TARGET "mkdir -p ${TARGET_DIR}"

          $SCP docker-compose.feature.yml ${SSH_TARGET}:${TARGET_DIR}/docker-compose.yml
          $SCP Caddyfile ${SSH_TARGET}:${TARGET_DIR}/Caddyfile
          $SCP .env ${SSH_TARGET}:${TARGET_DIR}/.env

          # Each branch keeps its own auth secret next to the deployment, so sessions survive
          # redeploys, never share production's secret and vanish with cleanup-feature.
          $SSH $SSH_TARGET "cd ${TARGET_DIR} && \
            umask 077 && \
            { [ -s .auth-secret ] || openssl rand -base64 32 > .auth-secret; } && \
            echo \"BETTER_AUTH_SECRET=\$(cat .auth-secret)\" >> .env"

          $SSH $SSH_TARGET "cd ${TARGET_DIR} && \
            docker compose pull && \
            docker compose up -d && \
            sudo systemctl reload caddy"

      - name: Seed demo data
        if: ${{ inputs.seed && (inputs.seed_mailbox || vars.SEED_MAILBOX) }}
        env:
          SEED_MAILBOX: ${{ inputs.seed_mailbox || vars.SEED_MAILBOX }}
        run: |
          set -o pipefail
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-cwa@codingforchange.com"
          BRANCH_NAME_SAFE=$(grep BRANCH_NAME_SAFE env_vars.txt | cut -d'=' -f2)
          TARGET_DIR="/var/www/cwa-feature-${BRANCH_NAME_SAFE}"

          # The app container migrates on start, so wait until the schema is there before seeding.
          $SSH $SSH_TARGET "cd ${TARGET_DIR} && \
            docker compose run --rm -T -e SEED_MAILBOX=${SEED_MAILBOX} app sh -c \
              'for i in \$(seq 1 30); do npx prisma migrate deploy >/dev/null 2>&1 && exec node seed.js --if-empty --list-accounts; sleep 5; done; echo \"Database never became ready\" >&2; exit 1'" \
            | tee seed.log
          grep '^SEED_ACCOUNT' seed.log | cut -f2- > seed-accounts.tsv || true

      - name: Comment deployment URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          URL="https://${{ env.BRANCH_NAME_SAFE }}.cwa.codingforchange.com"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          BODY="🚀 Feature branch deployed: $URL"
          if [ -s seed-accounts.tsv ]; then
            BODY="$BODY

          Seeded accounts, sign in with an email OTP:

          | Email | Roles |
          | --- | --- |
          $(awk -F'\t' '{ printf "| `%s` | %s |\n", $1, $2 }' seed-accounts.tsv)"
          fi
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --edit-last --create-if-none --body "$BODY"
          else
            echo "No open PR for branch $BRANCH — skipping comment"
          fi

      - name: Clean up Secrets
        if: always()
        run: |
          rm -f .vault_pass dump.yml decrypted.json .env Caddyfile env_vars.txt
