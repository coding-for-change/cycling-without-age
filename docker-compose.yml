services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cwa
      MYSQL_DATABASE: cwa_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcwa"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql:
