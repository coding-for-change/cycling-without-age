# CodeRabbit configuration — https://docs.coderabbit.ai/reference/yaml-template
#
# Purpose: surface bugs, authorization holes and other vulnerabilities in a diff.
#
# Brand, typography and layout are enforced elsewhere — ESLint and
# scripts/check-brand-tokens.mjs in CI, and docs/BRAND.md plus the frontend skill,
# which the knowledge_base block below feeds to CodeRabbit as guidelines. AGENTS.md
# and CLAUDE.md are ingested by default. Do not restate those documents here: the
# instruction budget goes to failure modes a reviewer can only catch by reading
# the code, and restated rules drift.

language: "en-US"
tone_instructions: >-
  Direct and concrete. Point at the line, say what breaks, and name the input or
  state that triggers it. Skip praise, preamble and restating the diff.
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true

  # Generated and vendored code: never review, never summarise.
  path_filters:
    - "!src/generated/**"
    - "!**/*.tsbuildinfo"
    - "!package-lock.json"
    - "!.next/**"
    - "!public/**"
    - "!worker.js"
    - "!**/*.otf"
    - "!**/*.woff2"

  path_instructions:
    # ------------------------------------------------------------- everything --
    - path: "**"
      instructions: |
        WHAT THIS REVIEW IS FOR, in order of priority:
        1. Bugs — wrong logic, unhandled null/empty/duplicate input, off-by-one,
           timezone and DST errors, a Promise not awaited or a rejection
           swallowed, state that can drift between MySQL, Redis and the Next.js
           cache, an invariant the old code kept and the new code does not.
        2. Security — missing or mis-scoped authorization, data reaching a
           browser that should not, injection, unsafe redirects, cache
           poisoning, secrets, weakened auth configuration.
        3. Reliability — retries that duplicate side effects, unbounded
           queries, races between check and write, migrations that lose data.
        4. Anything else only when it is a real defect with a concrete failure.

        For each finding give: the input or state that triggers it, what
        happens, and the smallest fix. A remark with no concrete failure path
        is not a finding — drop it.

        DO NOT COMMENT ON formatting, import order, naming taste, Tailwind class
        order, colour tokens, typography, copy wording, or anything Prettier,
        ESLint (eslint-plugin-boundaries, no-restricted-imports) or
        scripts/check-brand-tokens.mjs already enforce in CI. Do not ask for
        comments or docstrings: this codebase deliberately has none
        (AGENTS.md § 2). Suggest a test only when it would have caught a bug
        you found in this diff.

    # ---------------------------------------------------- server-side safety --
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        AUTHORIZATION. Guards live in `@/lib/auth-guards`: requireAuth,
        requireSuperAdmin, requireCountryAdmin(countryId),
        requireChapterAdmin(chapterId), requireCountryAdminOfChapter(chapterId),
        requireChapterRole(chapterId, role), requireAdminScope,
        requirePerspective. Facades and services trust the ids they are given.
        - Every exported function in a `"use server"` file, every route.ts
          handler and every page.tsx that shows non-public data must call a
          guard before its first database read or write. Flag one that does
          not. A layout is not a security boundary; the page re-guards.
        - The scope id handed to a guard usually comes from client input
          (`parsed.data.chapterId`). Flag when the record actually mutated
          (userId, applicationId, passengerId, notificationId, token…) is not
          proven to belong to that scope in the facade/service query
          (`where: { id, chapterId }`, `recipientUserId`). A chapter admin of A
          sending chapterId=A with a userId from chapter B is the failure.
        - When the scope must be read from the record first, the read must sit
          behind requireAuth so anonymous callers cannot probe ids — see
          decideApplicationAction in src/app/admin/members/actions.ts.
        - `redirect()`, `forbidden()`, `unauthorized()` and `notFound()` throw.
          Flag a guard or one of these inside a try/catch that catches
          everything: the catch swallows the interrupt and the action keeps
          running or returns `{ ok: false, error: "generic" }`.
        - Flag a superadmin-only operation (deleting a user, country changes)
          gated by a chapter guard, or a chapter operation gated only by
          requireAuth.

        INPUT. Actions take `unknown` and parse with the feature's Zod schema
        before anything else. Flag: a typed action parameter with no
        safeParse; a schema that lets the client set a server-owned field
        (userId, role, status, chapterId where the session decides it,
        createdBy); `data: parsed.data` or a spread into Prisma where the
        schema is wider than the intended columns; `$queryRawUnsafe`,
        `$executeRawUnsafe` or any SQL built from strings; `findMany` without
        `take` on anything that reaches a page or a response.

        DATA EXPOSURE. Everything a Server Component passes as props to a
        Client Component, and everything an Action returns, goes to the
        browser. Flag: a select/include or return value carrying Passkey,
        Account, Session, Verification, Device tokens, or other users' email,
        phone or address past the facade; `process.env.*` read in a Client
        Component; a secret named `NEXT_PUBLIC_*` (today only APP_URL,
        MAPBOX_TOKEN and the store URLs are public on purpose); raw error
        messages, stack traces or Prisma errors returned to the client
        instead of a coded result.

        REDIRECTS AND COOKIES. Only `safeNextPath` in src/lib/redirects.ts may
        turn a URL, cookie or header value into a redirect target. Flag any
        `redirect(` or `NextResponse.redirect(` fed by searchParams, cookies
        or headers that bypasses it, and any change that loosens it.
        src/proxy.ts checks cookie presence, not a valid session: flag logic
        added there that grants access on its own. Flag cookies set without
        httpOnly, sameSite and `secure` in production, or whose value is
        trusted without validation.

        CACHE COMPONENTS (next.config.ts: cacheComponents: true). A
        `"use cache"` function is shared across users. Flag one that reads
        cookies(), headers() or getSession(), or renders user-specific data
        without the user id in its arguments — it serves one user's page to
        the next. Flag `cacheLife`/`cacheTag` changes that keep auth-relevant
        data alive longer, and React `cache()` used for anything beyond one
        request.

        RATE LIMITING AND ABUSE. `withinRateLimit` (src/lib/rate-limit.ts) is
        an in-process Map: per instance, lost on restart, not shared with the
        worker. Flag a new path that sends email, SMS or push, or creates
        accounts, with no rate limit, and flag code that relies on the
        limiter as a hard security control. Flag responses that differ for an
        existing versus unknown email, slug or id to anonymous callers.

        AUTH CONFIGURATION (src/lib/auth.ts, src/app/.well-known/**,
        next.config.ts). Flag widening of `trustedOrigins`, passkey `origin`
        or rpID, `allowedDevOrigins`, or the Android fingerprints served from
        .well-known outside a dev-only branch; flag session lifetime, OTP or
        rate-limit settings weakened.

        CONCURRENCY. Flag check-then-write without a transaction or unique
        constraint (last admin, one application per user, one device token),
        `Promise.all` where one rejection leaves the others half-applied, and
        a side effect fired without `await`.

    # --------------------------------------------- outbox, worker, notifications --
    - path: "src/{lib/events,worker,use-cases/notifications,features/notifications}/**"
      instructions: |
        The transactional outbox: the business write and `emit()` commit
        together inside `transaction()` (src/lib/events/emit.ts); enqueueing
        happens after the commit; the sweeper re-enqueues anything Redis never
        heard about; BullMQ retries failed jobs. Everything downstream
        therefore runs at least once.
        - Flag a side effect (email, push, SMS, Redis) inside the transaction
          callback, or an emit outside `transaction()`.
        - Flag a listener or delivery that is not idempotent: creating a
          Notification or Delivery without a unique key or existence check,
          sending before recording the attempt, counting on a single run.
        - jobIds become Redis keys `bull:<queue>:<jobId>` and must not contain
          a colon. Flag a new jobId format.
        - ioredis runs with `maxRetriesPerRequest: null`, so a Redis call in a
          request path without a timeout hangs the request after commit. Flag
          it.
        - A Use Case must stay callable from CRON, scripts and tests. Flag work
          that assumes a request scope.
        - A tapped push may only navigate to an app-relative `href`. Flag an
          absolute URL or a user-controlled string in the payload.
        - Flag device-token handling that lets a user register a token to
          another user, or unregister a token they do not own.
        - The bull-board dashboard on WORKER_PORT has no auth and shows raw
          job payloads. Flag anything that exposes it: a `ports:` mapping on
          the worker service, a Caddy route, or mounting it in the app.

    # ----------------------------------------------------------------- database --
    - path: "prisma/**"
      instructions: |
        Migrations are hand-written SQL applied by `prisma migrate deploy` when
        the app container starts, while the previous image may still be
        serving. Flag: DROP or RENAME of a column or table current code still
        reads; NOT NULL added without a default or backfill; a unique index on
        data that may already hold duplicates; a type change that truncates;
        a new foreign key without an index (MySQL); schema.prisma and the
        migration disagreeing. For a new or changed `onDelete: Cascade`, say
        exactly which rows deleting a User, Organization or Country would take
        with it. Flag PII added to a model without a reason in the PR.

    # ------------------------------------------------------- CI, deploy, infra --
    - path: "{.github/**,Dockerfile,docker-compose*.yml,Caddyfile,.config/**,scripts/**,.husky/**}"
      instructions: |
        - Workflows: flag `pull_request_target`, a third-party action pinned to
          a tag instead of a SHA, `${{ github.event.* }}` or other untrusted
          text interpolated into `run:`, a secret echoed or written to a file
          that outlives the step, a job with no `permissions:` block, and any
          new host key acceptance at deploy time.
        - Dockerfile: running as root, a secret in a build ARG or ENV
          (anything not NEXT_PUBLIC_* is baked into the image), copying .env
          or .vault_pass, dropping `npm ci`.
        - Compose and Caddy: a port bound to 0.0.0.0 instead of 127.0.0.1,
          Redis or the worker exposed, a removed healthcheck, the worker
          running migrations alongside the app.
        - .config/secrets.yml: every value is a `!vault` tag. Flag plaintext.

    # ----------------------------------------------------------------- native --
    - path: "{ios/**,android/**,capacitor.config.ts,src/lib/native/**}"
      instructions: |
        The apps are thin Capacitor shells loading https://cwa.codingforchange.com.
        Flag: `NSAllowsArbitraryLoads`, `usesCleartextTraffic="true"`,
        `android:exported="true"` on a component without a permission,
        `allowBackup="true"`, `debuggable`, a new Info.plist or manifest
        permission no feature uses, and `server.url`, `allowNavigation` or
        `cleartext` in capacitor.config.ts pointing anywhere but the production
        origin outside the CAP_SERVER_URL dev override. Wrappers in
        src/lib/native/* must stay SSR-safe no-ops guarded by
        `Capacitor.isNativePlatform()`; flag plugin access at module scope.

    # --------------------------------------------------------------------- UI --
    - path: "src/**/*.{tsx,css}"
      instructions: |
        UI is secondary in this review. Brand and layout rules come from
        docs/BRAND.md and .claude/skills/frontend/SKILL.md via the knowledge
        base; apply them only when a diff clearly breaks one, never ahead of a
        bug. Worth a comment here:
        - `dangerouslySetInnerHTML` or `srcDoc` with anything user-influenced.
          The existing uses render a dicebear SVG from a seed and an inline
          lang script; a new one needs the same justification.
        - Formatting an instant without an explicit `timeZone`, or an `Intl.*`
          formatter with a hardcoded locale: hydration mismatch and wrong
          dates for real users.
        - A control hidden client-side while the Server Action behind it stays
          unguarded.
        - Removed aria-*, role, focus or keyboard handling in
          src/components/ui/**.
        - A user-visible string committed in a form that cannot be extracted
          for translation.

    # ------------------------------------------------------------------- docs --
    - path: "{docs/**,docs-internal/**,*.md,.claude/**}"
      instructions: |
        Flag references to files, exports or paths that do not exist in the
        repo. In .claude/settings*.json flag a hook that runs a shell command
        or a permission allowlist entry broader than the task needs.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - ".*"

  finishing_touches:
    # AGENTS.md § 2: code is self-explanatory, no comments.
    docstrings:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Authorization on server entry points"
        mode: "warning"
        instructions: |
          For every function added or changed in a "use server" file, every
          route.ts export, and every page.tsx under src/app/admin, src/app/pilot
          and src/app/passenger: confirm it calls a guard from @/lib/auth-guards
          before its first database read or write, that the guard's scope id is
          tied to the record it mutates, and that the guard is not inside a
          try/catch. Fail if any entry point lacks one or the scope cannot be
          tied to the mutated record.
      - name: "Migration safety"
        mode: "warning"
        instructions: |
          If prisma/migrations changed: fail when a statement drops or renames a
          column or table current code still reads, adds NOT NULL without a
          default or backfill, or adds a unique index with no note on existing
          duplicates. Migrations run at container start via prisma migrate
          deploy while the previous version may still be serving.

  tools:
    # Semgrep only runs when a semgrep.yml exists in the repo; there is none yet.
    # Secret scanning (gitleaks, trufflehog), dependency CVEs (osvScanner),
    # IaC (trivy, checkov, hadolint), workflows (actionlint, zizmor), eslint,
    # prismaLint and reactDoctor are on by default and stay on.
    biome:
      enabled: false # Prettier + ESLint already run in CI
    languagetool:
      enabled: false # grammar nits on docs are not what this review is for
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - files: "docs-internal/ARCHITECTURE.md"
        applyTo: "src/**/*.ts,src/**/*.tsx"
      - files: "docs/BRAND.md,.claude/skills/frontend/SKILL.md"
        applyTo: "src/**/*.tsx,src/**/*.css,src/emails/**"
