x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    image: localhost:5000/cwa:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *logging
    labels:
      alloy-logging: "true"
      logging.project: cwa
      logging.service: web
      logging.environment: production
      prometheus.scrape: "true"
      prometheus.port: "9464"
      prometheus.path: "/metrics"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    image: localhost:5000/cwa:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *logging
    labels:
      alloy-logging: "true"
      logging.project: cwa
      logging.service: worker
      logging.environment: production
      prometheus.scrape: "true"
      prometheus.port: "9464"
      prometheus.path: "/metrics"
    # Migrations belong to the app container; two of them racing is asking for it.
    command: node --require ./worker-instrument.js worker.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.WORKER_PORT ?? 3001) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    labels:
      alloy-logging: "true"
      logging.project: cwa
      logging.service: redis
      logging.environment: production
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1-alpine
    restart: unless-stopped
    logging: *logging
    labels:
      logging.project: cwa
      logging.service: redis-exporter
      logging.environment: production
      prometheus.scrape: "true"
      prometheus.port: "9121"
      prometheus.path: "/metrics"
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis:
